name: Experiment reports

on:
  push:
    paths:
      - 'Tools/SLMRerankerExperiment/**'
      - 'Tools/ContextualEvaluation/**'
      - 'Source/Engine/**'
      - 'docs/reports/experiments/**'
      - 'Tests/fixtures/contextual_bopomofo/**'
      - 'Models/*.json'
      - '.github/workflows/experiment-reports.yml'
  pull_request:
    paths:
      - 'Tools/SLMRerankerExperiment/**'
      - 'Tools/ContextualEvaluation/**'
      - 'Source/Engine/**'
      - 'docs/reports/experiments/**'
      - 'Tests/fixtures/contextual_bopomofo/**'
      - 'Models/*.json'
      - '.github/workflows/experiment-reports.yml'

jobs:
  validate:
    name: Validate experiment reports and harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile experiment Python tools
        run: |
          python3 -m py_compile Tools/SLMRerankerExperiment/*.py
          python3 -m py_compile Tools/ContextualEvaluation/*.py
      - name: Build language model data
        run: make data.txt
        working-directory: Source/Data
      - name: Validate experiment registry
        run: python3 Tools/SLMRerankerExperiment/validate_experiment_reports.py
      - name: Self-test report validator
        run: python3 Tools/SLMRerankerExperiment/validate_experiment_reports.py --self-test
      - name: Self-test benchmark suite
        run: python3 Tools/SLMRerankerExperiment/run_benchmark_suite.py --self-test
      - name: Self-test experiment runner
        run: python3 Tools/SLMRerankerExperiment/run_experiment.py --self-test
      - name: Self-test local LLM scorer wrapper
        run: python3 Tools/SLMRerankerExperiment/local_llm_scorer.py --self-test
      - name: Self-test candidate ranker tools
        run: |
          python3 Tools/SLMRerankerExperiment/train_candidate_ranker.py --self-test
          python3 Tools/SLMRerankerExperiment/candidate_ranker_scorer.py --self-test
          python3 Tools/SLMRerankerExperiment/analyze_candidate_ranker.py --self-test
      - name: Self-test fixture hygiene audit
        run: python3 Tools/ContextualEvaluation/fixture_hygiene_audit.py --self-test
      - name: Configure engine libraries
        run: cmake -DENABLE_TEST=OFF -S . -B build
        working-directory: Source/Engine
      - name: Build engine libraries
        run: cmake --build build --target McBopomofoLMLib
        working-directory: Source/Engine
      - name: Configure contextual evaluator
        run: cmake -S . -B build
        working-directory: Tools/ContextualEvaluation
      - name: Build contextual evaluator
        run: cmake --build build --target evaluator
        working-directory: Tools/ContextualEvaluation
      - name: Self-test deterministic gate
        run: python3 Tools/ContextualEvaluation/validate_deterministic_gate.py --self-test
      - name: Run deterministic canonical gate
        run: python3 Tools/ContextualEvaluation/validate_deterministic_gate.py
      - name: CI smoke full benchmark suite pipeline
        run: python3 Tools/SLMRerankerExperiment/run_benchmark_suite.py --ci-smoke
