name: Experiment reports

on:
  push:
    paths:
      - 'Tools/SLMRerankerExperiment/**'
      - 'Tools/ContextualEvaluation/**'
      - 'Source/Engine/**'
      - 'docs/reports/experiments/**'
      - 'Tests/fixtures/contextual_bopomofo/**'
      - 'Models/*.json'
      - '.github/workflows/experiment-reports.yml'
  pull_request:
    paths:
      - 'Tools/SLMRerankerExperiment/**'
      - 'Tools/ContextualEvaluation/**'
      - 'Source/Engine/**'
      - 'docs/reports/experiments/**'
      - 'Tests/fixtures/contextual_bopomofo/**'
      - 'Models/*.json'
      - '.github/workflows/experiment-reports.yml'

jobs:
  validate:
    name: Validate experiment reports and harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile experiment Python tools
        run: |
          python3 -m py_compile Tools/SLMRerankerExperiment/*.py
          python3 -m py_compile Tools/ContextualEvaluation/*.py
      - name: Build language model data
        run: make data.txt
        working-directory: Source/Data
      - name: Validate experiment registry
        run: python3 Tools/SLMRerankerExperiment/validate_experiment_reports.py
      - name: Self-test report validator
        run: python3 Tools/SLMRerankerExperiment/validate_experiment_reports.py --self-test
      - name: Self-test benchmark suite
        run: python3 Tools/SLMRerankerExperiment/run_benchmark_suite.py --self-test
      - name: Validate SLM promotion gate
        run: |
          python3 Tools/SLMRerankerExperiment/validate_slm_promotion_gate.py --self-test
          python3 Tools/SLMRerankerExperiment/validate_slm_promotion_gate.py --report docs/reports/experiments/phase2/slm_qwen2_5_0_5b_index_taiwan_ambiguous.json --required-fixture heldout_generalization_clean --expect-fail
      - name: Self-test experiment runner
        run: python3 Tools/SLMRerankerExperiment/run_experiment.py --self-test
      - name: Self-test local LLM scorer wrapper
        run: python3 Tools/SLMRerankerExperiment/local_llm_scorer.py --self-test
      - name: Self-test candidate ranker tools
        run: |
          python3 Tools/SLMRerankerExperiment/train_candidate_ranker.py --self-test
          python3 Tools/SLMRerankerExperiment/candidate_ranker_scorer.py --self-test
          python3 Tools/SLMRerankerExperiment/analyze_candidate_ranker.py --self-test
      - name: Self-test fixture hygiene audit
        run: python3 Tools/ContextualEvaluation/fixture_hygiene_audit.py --self-test
      - name: Validate heldout clean export
        run: |
          python3 Tools/ContextualEvaluation/fixture_hygiene_audit.py --export-clean heldout_generalization > /tmp/heldout_export.json
          python3 - <<'PY'
          import json
          import pathlib

          report = json.load(open("/tmp/heldout_export.json", encoding="utf-8"))
          exports = report.get("clean_exports", [])
          assert exports, "missing clean_exports"
          export = exports[0]
          path = pathlib.Path(export["path"])
          assert path.is_file(), f"missing export file: {path}"
          rows = [line for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == export["clean"], (len(rows), export["clean"])
          assert len(rows) > 0, "empty clean export"
          print(f"heldout clean export rows={len(rows)}")
          PY
      - name: Validate dogfood evidence template
        run: |
          python3 Tools/ContextualEvaluation/validate_dogfood_evidence.py --self-test
          python3 Tools/ContextualEvaluation/validate_dogfood_evidence.py --dogfood docs/reports/experiments/phase3/dogfood_evidence_template.json
      - name: Validate dogfood evidence generator
        run: |
          python3 Tools/ContextualEvaluation/generate_dogfood_evidence.py --self-test
          python3 Tools/ContextualEvaluation/generate_dogfood_evidence.py --mode Deterministic --status session_complete --output /tmp/dogfood_generated.json
          python3 Tools/ContextualEvaluation/validate_dogfood_evidence.py --dogfood /tmp/dogfood_generated.json
      - name: Configure engine libraries
        run: cmake -DENABLE_TEST=OFF -DCMAKE_BUILD_TYPE=Release -S . -B build
        working-directory: Source/Engine
      - name: Build engine libraries
        run: |
          cmake --build build --target gramambular2_lib
          cmake --build build --target MandarinLib
          cmake --build build --target McBopomofoLMLib
        working-directory: Source/Engine
      - name: Configure contextual evaluator
        run: cmake -DCMAKE_BUILD_TYPE=Release -S . -B build
        working-directory: Tools/ContextualEvaluation
      - name: Build contextual evaluator
        run: cmake --build build --target evaluator
        working-directory: Tools/ContextualEvaluation
      - name: Self-test deterministic gate
        run: python3 Tools/ContextualEvaluation/validate_deterministic_gate.py --self-test
      - name: Run deterministic canonical gate
        run: python3 Tools/ContextualEvaluation/validate_deterministic_gate.py
      - name: Run deterministic heldout clean gate
        run: python3 Tools/ContextualEvaluation/validate_deterministic_gate.py --heldout
      - name: CI smoke full benchmark suite pipeline
        run: python3 Tools/SLMRerankerExperiment/run_benchmark_suite.py --ci-smoke
      - name: CI smoke character candidate pipeline
        run: python3 Tools/SLMRerankerExperiment/run_benchmark_suite.py --ci-smoke --slm-candidate-granularity character --output /tmp/slm_ci_smoke_character_report.json
      - name: Validate runtime readiness matrix
        run: |
          python3 Tools/SLMRerankerExperiment/validate_runtime_readiness_matrix.py --self-test
          python3 Tools/SLMRerankerExperiment/validate_runtime_readiness_matrix.py
